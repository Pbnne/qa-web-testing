<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка баланса проезного</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
        }
        input {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 250px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
    </style>
    <script>
        async function checkBalance() {
            const sms = document.getElementById('cardNumber').value;
            const data = new FormData();
            data.append('bsk', sms);
            data.append('cardsource', 'new');
            data.append('user_lang', 'ru');

            // Логируем отправляемые данные
            console.log('Отправляемые данные:', {
                bsk: sms,
                cardsource: 'new',
                user_lang: 'ru'
            });

            try {
                const response = await fetch('https://alpha.ltkarta.ru/fideth', {
                    method: 'POST',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Cache-Control': 'no-cache', // Отключаем кеширование
                        'Pragma': 'no-cache', // Отключаем кеширование
                        'Accept': 'application/json, text/javascript, */*; q=0.01',
                        'sec-ch-ua-platform': '"Windows"',
                        'sec-ch-ua': '"Not A(Brand";v="8", "Chromium";v="132", "YaBrowser";v="25.2", "Yowser";v="2.5"',
                        'sec-ch-ua-mobile': '?0',
                        'Sec-Fetch-Site': 'same-origin',
                        'Sec-Fetch-Mode': 'cors',
                        'Sec-Fetch-Dest': 'empty'
                    },
                    body: data
                });

                console.log('Response Status:', response.status); // Лог статуса ответа

                if (response.ok) {
                    const jsonResponse = await response.json(); // Получаем JSON
                    console.log('JSON Response:', jsonResponse); // Логируем ответ JSON
                    if (jsonResponse.action === "error") {
                        document.getElementById('result').innerText = `Ошибка: ${jsonResponse.error_text}`;
                    } else {
                        // Обработка успешного ответа
                        document.getElementById('result').innerText = "Запрос выполнен успешно.";
                    }
                } else {
                    const errorText = await response.text();
                    console.error('Error Response:', errorText); // Логируем текст ошибки
                    document.getElementById('result').innerText = `Ошибка: ${response.status} - ${errorText}`;
                }
            } catch (error) {
                document.getElementById('result').innerText = "Произошла ошибка при выполнении запроса.";
                console.error("Ошибка:", error);
            }
        }
    </script>
</head>
<body>
    <h1>Проверка баланса проезного</h1>
    <input type="text" id="cardNumber" placeholder="Введите номер карты" required>
    <button onclick="checkBalance()">Проверить баланс</button>
    <p id="result"></p>
</body>
</html>
